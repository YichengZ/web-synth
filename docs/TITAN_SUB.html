    <style>
        body {
            margin: 0;
            background-color: #09090b;
            color: #e4e4e7;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-user-select: none;
               -moz-user-select: none;
                    user-select: none;
        }

        .font-mono {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        }

        @media (min-width: 1024px) {
            body { overflow: hidden; }
        }

        .grid-bg {
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        .cursor-ns-resize {
            cursor: ns-resize;
        }

        .cursor-ew-resize {
            cursor: ew-resize;
        }

        .graph-tooltip {
            position: fixed;
            background: rgba(24, 24, 27, 0.95);
            border: 1px solid #3f3f46;
            color: #4ade80;
            padding: 4px 8px;
            font-size: 10px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            border-radius: 4px;
            pointer-events: none;
            z-index: 9999;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .record-pulse {
            animation: pulse-red 1.5s infinite;
        }

        /* --- V10 ROBUST SLIDER --- */
        input[type=range].titan-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 20px;
            /* Comfortable hit area */
            background: transparent;
            cursor: pointer;
            margin: 0;
        }

        input[type=range].titan-slider:focus {
            outline: none;
        }

        /* Thumb */
        input[type=range].titan-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -5px;
            /* Center relative to track */
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        /* Track - Visualized via CSS gradient in React style, base style here */
        input[type=range].titan-slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            border-radius: 2px;
            /* Background set dynamically in JS */
        }
    </style>
