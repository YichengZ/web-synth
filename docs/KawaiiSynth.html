    <!-- Custom Styles -->
    <style>
        body {
            margin: 0;
            background-color: #020617;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .record-pulse {
            animation: pulse-red 1.5s infinite;
        }

        /* Kawaii slider track, progress, and thumb stay visible on every panel tone. */
        .kawaii-range {
            -webkit-appearance: none;
            -moz-appearance: none;
                 appearance: none;
            height: 8px;
            border: 1px solid #334155;
            border-radius: 999px;
            background: linear-gradient(
                to right,
                var(--slider-accent) 0 var(--slider-progress),
                #1e293b var(--slider-progress) 100%
            );
        }

        .kawaii-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid var(--slider-accent);
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 0 2px #020617, 0 2px 6px rgba(0, 0, 0, 0.55);
        }

        .kawaii-range::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            border-radius: 999px;
            background: transparent;
        }

        .kawaii-range::-moz-range-track {
            height: 6px;
            border-radius: 999px;
            background: #1e293b;
        }

        .kawaii-range::-moz-range-progress {
            height: 6px;
            border-radius: 999px;
            background: var(--slider-accent);
        }

        .kawaii-range::-moz-range-thumb {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid var(--slider-accent);
            cursor: pointer;
            box-shadow: 0 0 0 2px #020617, 0 2px 6px rgba(0, 0, 0, 0.55);
        }

        .kawaii-range:disabled {
            opacity: 0.52;
        }

        .kawaii-range:focus-visible {
            outline-color: var(--slider-accent);
        }
    </style>
